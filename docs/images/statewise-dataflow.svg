<svg width="100%" viewBox="0 0 680 776" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">StateWise data flow, updated</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Binance provides market data into LiveFeed, which flows through feature engineering, the gradient boosting predictor and HMM regime detector, the risk engine, position sizer, and exit and portfolio monitor. The monitor feeds back into the risk engine each cycle. The final trade decision is sent to the user's own Binance account for execution, which is out of scope for StateWise itself.</desc>
